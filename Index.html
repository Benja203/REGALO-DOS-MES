<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>18!!! ❤</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=Dancing+Script:wght@600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    #scene {
      min-height: 100vh;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 2rem 1rem;
    }

    #scene::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 40%, #3a2a10 0%, #1a1208 40%, #0a0807 100%);
      opacity: 0;
      transition: opacity 1.5s ease;
      pointer-events: none;
      z-index: 0;
    }
    #scene.on::before { opacity: 1; }

    #scene > * { position: relative; z-index: 1; }

    #title-text {
      font-family: 'Dancing Script', cursive;
      font-size: 2.8rem;
      color: #c9a96e;
      text-align: center;
      opacity: 0;
      transform: translateY(-20px);
      transition: opacity 1.2s ease 0.6s, transform 1.2s ease 0.6s;
      text-shadow: 0 0 20px rgba(201, 169, 110, 0.6);
      margin-bottom: 1.4rem;
      letter-spacing: 3px;
    }
    #scene.on #title-text { opacity: 1; transform: translateY(0); }

    #middle-row {
      display: flex;
      align-items: center;
      gap: 2.5rem;
    }

    .hearts-side {
      display: flex;
      flex-direction: column;
      gap: 1.4rem;
      opacity: 0;
      transition: opacity 1.2s ease 0.8s;
    }
    #scene.on .hearts-side { opacity: 1; }

    .heart-wrap {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .heart-wrap::before {
      content: '';
      position: absolute;
      top: 29px; left: 29px;
      width: 58px; height: 58px;
      transform: translate(-50%, -50%) scale(1);
      border-radius: 50%;
      border: 2px solid rgba(200, 0, 40, 0.6);
      animation: ripple 1.8s ease-out infinite;
      pointer-events: none;
    }
    .heart-wrap::after {
      content: '';
      position: absolute;
      top: 29px; left: 29px;
      width: 58px; height: 58px;
      transform: translate(-50%, -50%) scale(1);
      border-radius: 50%;
      border: 2px solid rgba(200, 0, 40, 0.35);
      animation: ripple 1.8s ease-out 0.6s infinite;
      pointer-events: none;
    }

    @keyframes ripple {
      0%   { transform: translate(-50%, -50%) scale(1);   opacity: 0.8; }
      100% { transform: translate(-50%, -50%) scale(2.2); opacity: 0; }
    }
    .heart-wrap.visited::before {
      border-color: rgba(30, 160, 50, 0.7);
    }
    .heart-wrap.visited::after {
      border-color: rgba(30, 160, 50, 0.4);
    }

    .click-label {
      font-family: 'Dancing Script', cursive;
      font-size: 0.72rem;
      color: rgba(201, 169, 110, 0.85);
      letter-spacing: 0.5px;
      animation: blink-label 1.6s ease-in-out infinite;
      white-space: nowrap;
    }

    @keyframes blink-label {
      0%, 100% { opacity: 0.9; }
      50%       { opacity: 0.25; }
    }

    .heart-btn {
      background: rgba(120, 0, 20, 0.18);
      border: 1.5px solid rgba(180, 0, 40, 0.35);
      cursor: pointer;
      font-size: 1.8rem;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 0 6px rgba(139, 0, 30, 0.5));
      transition: filter 0.2s ease, background 0.2s ease, border-color 0.2s ease;
      text-decoration: none;
      animation: heartbeat 1.8s ease-in-out infinite;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      20%       { transform: scale(1.13); }
      40%       { transform: scale(1); }
      60%       { transform: scale(1.08); }
      80%       { transform: scale(1); }
    }

    .heart-btn:hover {
      background: rgba(160, 0, 30, 0.35);
      border-color: rgba(220, 0, 50, 0.7);
      filter: drop-shadow(0 0 14px rgba(180, 0, 40, 0.9));
      animation: none;
      transform: scale(1.2);
    }
    .heart-btn:active { transform: scale(0.93); animation: none; }
    .heart-btn.clicked {
      animation: heartbeat 1.8s ease-in-out infinite;
    }

    #lamp-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #lamp-glow {
      width: 160px;
      height: 160px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #glow-ring {
      position: absolute;
      width: 210px;
      height: 210px;
      border-radius: 50%;
      background: transparent;
      transition: background 1.5s ease;
      pointer-events: none;
    }
    #scene.on #glow-ring {
      background: radial-gradient(circle, rgba(255,200,80,0.45) 0%, rgba(255,160,30,0.15) 50%, transparent 70%);
      animation: pulse 2.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%       { transform: scale(1.08); opacity: 0.85; }
    }

    #lamp-svg { position: relative; z-index: 2; }

    .lamp-shade { fill: #2a2a2a; transition: fill 1s ease; }
    .lamp-bulb  { fill: #333;    transition: fill 1s ease, filter 1s ease; }
    .lamp-pole  { fill: #1e1e1e; transition: fill 1s ease; }
    .lamp-base  { fill: #252525; transition: fill 1s ease; }

    #scene.on .lamp-shade { fill: #c8820a; }
    #scene.on .lamp-bulb  { fill: #fff4b0; filter: drop-shadow(0 0 14px #ffe066); }
    #scene.on .lamp-pole  { fill: #8b6914; }
    #scene.on .lamp-base  { fill: #a07820; }

    #switch-wrap {
      margin-top: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    #switch-label {
      font-family: 'Dancing Script', cursive;
      font-size: 1.1rem;
      color: #555;
      transition: color 0.8s ease;
    }
    #scene.on #switch-label { color: #c9a96e; }

    #toggle {
      width: 62px;
      height: 34px;
      background: #1e1e1e;
      border-radius: 17px;
      border: 1.5px solid #333;
      position: relative;
      cursor: pointer;
      transition: background 0.6s ease, border-color 0.6s ease;
    }
    #toggle.on {
      background: #b8770a;
      border-color: #e0a020;
    }
    #toggle::after {
      content: '';
      position: absolute;
      top: 4px; left: 4px;
      width: 24px; height: 24px;
      border-radius: 50%;
      background: #444;
      transition: transform 0.4s ease, background 0.4s ease;
    }
    #toggle.on::after {
      transform: translateX(28px);
      background: #fff8dc;
    }

    #sub-text {
      font-family: 'Dancing Script', cursive;
      font-size: 1.3rem;
      color: #c9a96e;
      text-align: center;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 1.2s ease 1s, transform 1.2s ease 1s;
      text-shadow: 0 0 15px rgba(201,169,110,0.5);
      margin-top: 2rem;
      max-width: 460px;
      line-height: 1.8;
    }
    #scene.on #sub-text { opacity: 1; transform: translateY(0); }

    .star {
      position: absolute;
      width: 2px; height: 2px;
      background: #fff;
      border-radius: 50%;
      opacity: 0.15;
      transition: opacity 1.5s ease;
    }
    #scene.on .star { opacity: 0; }

    .stamp-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .stamp {
      display: none;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) rotate(-20deg) scale(0);
      width: 62px; height: 62px;
      border-radius: 50%;
      border: 2.5px solid rgba(20, 120, 40, 0.9);
      background: rgba(0,0,0,0.45);
      box-shadow: 0 0 0 1.5px rgba(20,120,40,0.35), inset 0 0 0 1.5px rgba(20,120,40,0.2);
      z-index: 20;
      pointer-events: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
    }
    .stamp.show {
      display: flex;
      animation: stampIn 0.35s cubic-bezier(0.23, 1, 0.32, 1) forwards;
    }
    @keyframes stampIn {
      0%   { transform: translate(-50%, -50%) rotate(-20deg) scale(2.2); opacity: 0; }
      60%  { transform: translate(-50%, -50%) rotate(-20deg) scale(0.88); opacity: 1; }
      100% { transform: translate(-50%, -50%) rotate(-20deg) scale(1);    opacity: 1; }
    }

    .stamp-text {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 0.72rem;
      font-weight: 900;
      color: rgba(20, 130, 40, 0.95);
      letter-spacing: 2px;
      text-transform: uppercase;
      line-height: 1;
      text-align: center;
      text-shadow: 0 0 4px rgba(20,130,40,0.3);
    }
    .stamp-stars {
      font-size: 0.4rem;
      color: rgba(20, 130, 40, 0.75);
      letter-spacing: 2px;
    }

    /* ---- Corazón secreto bloqueado ---- */
    #secret-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.8rem;
      opacity: 0;
      transition: opacity 1s ease 0.5s;
    }
    #scene.on #secret-wrap { opacity: 1; }

    #secret-heart-container {
      position: relative;
      width: 64px; height: 64px;
      display: flex; align-items: center; justify-content: center;
    }

    /* Aros apagados */
    #secret-heart-container::before,
    #secret-heart-container::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 64px; height: 64px;
      border-radius: 50%;
      border: 2px solid rgba(80,80,80,0.4);
      transform: translate(-50%,-50%) scale(1);
      animation: ripple-dark 2s ease-out infinite;
      pointer-events: none;
    }
    #secret-heart-container::after {
      animation-delay: 0.7s;
    }
    #scene.on.unlocked #secret-heart-container::before,
    #scene.on.unlocked #secret-heart-container::after {
      border-color: rgba(200, 0, 40, 0.6);
      animation: ripple 1.8s ease-out infinite;
    }
    @keyframes ripple-dark {
      0%   { transform: translate(-50%,-50%) scale(1);   opacity: 0.6; }
      100% { transform: translate(-50%,-50%) scale(2.1); opacity: 0; }
    }

    #secret-btn {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: rgba(30,30,30,0.7);
      border: 2px solid rgba(80,80,80,0.5);
      display: flex; align-items: center; justify-content: center;
      position: relative;
      cursor: not-allowed;
      transition: background 0.8s ease, border-color 0.8s ease, box-shadow 0.8s ease;
      font-size: 1.8rem;
      filter: grayscale(1) brightness(0.4);
      transition: filter 0.8s ease, background 0.8s ease, border 0.8s ease, cursor 0.2s;
    }
    #scene.on.unlocked #secret-btn {
      filter: grayscale(0) brightness(1);
      background: rgba(120,0,20,0.2);
      border-color: rgba(180,0,40,0.5);
      cursor: pointer;
      box-shadow: 0 0 18px rgba(200,0,40,0.4);
      animation: heartbeat 1.8s ease-in-out infinite;
    }

    #lock-icon {
      position: absolute;
      font-size: 1.1rem;
      bottom: 2px; right: 2px;
      transition: opacity 0.6s ease, transform 0.6s ease;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.8));
    }
    #scene.on.unlocked #lock-icon {
      animation: lockFall 0.7s ease forwards;
    }
    @keyframes lockFall {
      0%   { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
      30%  { transform: translateY(-8px) rotate(-15deg) scale(1.3); opacity: 1; }
      60%  { transform: translateY(5px) rotate(25deg) scale(0.8); opacity: 0.7; }
      100% { transform: translateY(40px) rotate(60deg) scale(0); opacity: 0; }
    }

    .lock-particle {
      position: absolute;
      font-size: 0.9rem;
      pointer-events: none;
      animation: particleBurst 0.7s ease-out forwards;
    }
    @keyframes particleBurst {
      0%   { transform: translate(0,0) scale(1); opacity: 1; }
      100% { transform: translate(var(--px), var(--py)) scale(0); opacity: 0; }
    }

    /* Barra de progreso */
    #progress-wrap {
      display: flex;
      gap: 5px;
    }
    .prog-block {
      width: 28px; height: 10px;
      border-radius: 3px;
      border: 1.5px solid rgba(120,120,120,0.5);
      background: transparent;
      transition: background 0.5s ease, border-color 0.5s ease, box-shadow 0.5s ease;
    }
    .prog-block.filled {
      background: #2a8a3a;
      border-color: #3dbb50;
      box-shadow: 0 0 6px rgba(40,180,60,0.6);
    }

    #secret-label {
      font-family: 'Dancing Script', cursive;
      font-size: 0.75rem;
      color: rgba(150,150,150,0.7);
      letter-spacing: 1px;
      transition: color 0.8s ease;
    }
    #scene.on.unlocked #secret-label {
      color: #c9a96e;
      animation: blink-label 1.6s ease-in-out infinite;
    }
  </style>
</head>

  var visitedCount = 0;
  var visitedSet = new Set();

  function markClicked(el) {
    var stampWrap = el.parentElement;
    var heartWrap = stampWrap.parentElement;

    // Evitar contar el mismo corazón dos veces
    if (!el.classList.contains('clicked')) {
      el.classList.add('clicked');
      if (heartWrap) heartWrap.classList.add('visited');
      var stamp = stampWrap.querySelector('.stamp');
      if (stamp) stamp.classList.add('show');

      // Llenar siguiente bloque de progreso
      if (visitedCount < 4) {
        var block = document.getElementById('pb' + visitedCount);
        if (block) {
          block.classList.add('filled');
          block.style.transform = 'scaleY(1.5)';
          setTimeout(function(){ block.style.transform = 'scaleY(1)'; block.style.transition = 'transform 0.2s ease'; }, 150);
          // Reproducir sonido correspondiente
          var snd = sndProgress[visitedCount];
          if (snd) { snd.currentTime = 0; snd.play(); }
        }
        visitedCount++;
      }

      // Desbloquear al completar los 4
      if (visitedCount >= 4) {
        setTimeout(function(){
          unlock();
        }, 400);
      }
    }
  }

    var cy = rect.top + rect.height/2;
    var emojis = ['✨','💥','⭐','💫','🔓'];
    for (var i = 0; i < 10; i++) {
      (function(idx) {
        setTimeout(function(){
          var p = document.createElement('div');
          p.className = 'lock-particle';
          var angle = (idx / 10) * Math.PI * 2;
          var dist = 30 + Math.random() * 40;
          p.style.setProperty('--px', (Math.cos(angle)*dist)+'px');
          p.style.setProperty('--py', (Math.sin(angle)*dist)+'px');
          p.style.left = (cx - 10) + 'px';
          p.style.top  = (cy - 10) + 'px';
          p.style.position = 'fixed';
          p.style.zIndex = '999';
          p.textContent = emojis[idx % emojis.length];
          document.body.appendChild(p);
          setTimeout(function(){ p.remove(); }, 750);
        }, idx * 40);
      })(i);
    }
  }

  function unlock() {
    var scene = document.getElementById('scene');
    scene.classList.add('unlocked');
    var btn = document.getElementById('secret-btn');
    btn.textContent = '❤️';
    var lock = document.createElement('span');
    lock.id = 'lock-icon';
    lock.textContent = '🔒';
    btn.appendChild(lock);
    // Sonido y partículas al caer el candado
    setTimeout(function(){
      sndZelda.currentTime = 0;
      sndZelda.play();
      spawnLockParticles();
    }, 80);
    // Hacer el corazón clickeable hacia la página secreta
    btn.onclick = function(e) {
      e.preventDefault();
      window.location.href = 'TU-PAGINA-SECRETA.html';
    };
    document.getElementById('secret-label').textContent = '¡toca el corazón!';
  }

  function toggleLamp() {
    isOn = !isOn;
    var scene  = document.getElementById('scene');
    var toggle = document.getElementById('toggle');
    var label  = document.getElementById('switch-label');

    if (isOn) {
      scene.classList.add('on');
      toggle.classList.add('on');
      label.textContent = 'Apagar';
      sndApagado.pause(); sndApagado.currentTime = 0;
      sndBucle.pause();   sndBucle.currentTime = 0;
      sndPrendido.currentTime = 0;
      sndPrendido.play();
      sndLuz.currentTime = 0;
      sndLuz.play();
    } else {
      scene.classList.remove('on');
      toggle.classList.remove('on');
      label.textContent = 'Encender';
      sndPrendido.pause(); sndPrendido.currentTime = 0;
      sndLuz.pause();      sndLuz.currentTime = 0;
      sndBucle.pause();    sndBucle.currentTime = 0;
      sndApagado.currentTime = 0;
      sndApagado.play();
    }
  }
</script>
</body>
</html>
