<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Ti ❤️</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; overflow:hidden; width:100vw; height:100vh;
  font-family:'Arial Rounded MT Bold','Arial Black',Arial,sans-serif; }

#overlay {
  position:fixed; inset:0; z-index:10; pointer-events:none;
  border:5px solid #8b0000;
  box-shadow:0 0 60px #8b0000 inset, 0 0 60px #8b0000;
  animation:borderGlow 2s ease-in-out infinite alternate;
}
@keyframes borderGlow {
  from { border-color:#8b0000; box-shadow:0 0 50px #8b0000 inset,0 0 50px #8b0000; }
  to   { border-color:#cc1122; box-shadow:0 0 90px #cc1122 inset,0 0 90px #cc1122; }
}
#canvas3d { position:fixed; inset:0; z-index:1; cursor:grab; }
#canvas3d:active { cursor:grabbing; }

#hint {
  position:fixed; bottom:24px; width:100%; text-align:center; z-index:20;
  color:rgba(220,80,80,.95); font-size:15px; letter-spacing:3px;
  text-transform:uppercase; pointer-events:none;
  animation:blink 1.5s ease-in-out infinite;
}
@keyframes blink { 0%,100%{opacity:.25} 50%{opacity:1} }

#labels { position:fixed; inset:0; z-index:5; pointer-events:none; opacity:0; transition:opacity 1.5s; }
#labels.visible { opacity:1; }

.label3d {
  position:absolute; transform:translate(-50%,-50%);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  border-radius:50%;
  background:radial-gradient(circle,rgba(60,0,20,.93) 0%,rgba(20,0,10,.97) 65%,#000 100%);
  border:3px solid rgba(180,0,50,.7);
  box-shadow:0 0 24px 8px rgba(160,0,40,.75), 0 0 55px 18px rgba(160,0,40,.35),
             inset 0 0 28px rgba(180,0,50,.15);
  text-align:center; pointer-events:none;
  animation:bubbleFloat ease-in-out infinite;
  overflow:hidden;
}
.label3d img { width:62%; height:55%; object-fit:contain;
  filter:drop-shadow(0 0 6px rgba(255,100,100,.7)); }
.label3d .txt { color:#fff; font-weight:900; font-size:13px; line-height:1.2;
  text-shadow:0 0 10px rgba(255,80,80,.9),0 2px 5px rgba(0,0,0,.9); padding:2px 6px; }

@keyframes bubbleFloat {
  0%,100% { margin-top:0px; }
  50%      { margin-top:-14px; }
}

.heart-label {
  position:absolute; transform:translate(-50%,-50%);
  pointer-events:none;
  filter:drop-shadow(0 0 18px rgba(180,0,50,.9));
  animation:bubbleFloat 4s ease-in-out infinite;
}

.red-circle-label {
  position:absolute; transform:translate(-50%,-50%);
  pointer-events:none;
  filter:drop-shadow(0 0 24px rgba(200,0,50,.95));
  animation:bubbleFloat 5s ease-in-out infinite;
  border-radius:50%;
  background:radial-gradient(circle at 35% 35%, rgba(255,120,120,.9), rgba(220,0,40,.95));
  border:3px solid rgba(255,60,60,.8);
  box-shadow:0 0 25px rgba(220,0,50,.9), 0 0 45px rgba(200,0,30,.6), inset 0 0 20px rgba(255,100,100,.5);
  display:flex; align-items:center; justify-content:center;
}

#floatingHearts { position:fixed; inset:0; z-index:6; pointer-events:none; opacity:0; transition:opacity 1s; overflow:hidden; }
#floatingHearts.visible { opacity:1; }

.shooting-star-canvas {
  position:absolute;
  pointer-events:none;
}

#warpCanvas { position:fixed; inset:0; z-index:8; pointer-events:none; opacity:0; }

#backBtn {
  position:fixed; top:18px; left:18px; z-index:30;
  display:flex; align-items:center; gap:8px;
  background:rgba(20,0,10,.75);
  border:2px solid rgba(180,0,50,.7);
  border-radius:30px;
  padding:9px 18px 9px 14px;
  color:#fff; font-size:14px; font-weight:900;
  letter-spacing:1px; cursor:pointer;
  box-shadow:0 0 18px rgba(160,0,40,.6), inset 0 0 10px rgba(180,0,50,.1);
  text-transform:uppercase;
  transition:background .2s, box-shadow .2s, transform .15s;
  text-decoration:none;
  font-family:inherit;
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
}
#backBtn:hover {
  background:rgba(140,0,30,.85);
  box-shadow:0 0 30px rgba(200,0,50,.8), inset 0 0 14px rgba(200,0,50,.2);
  transform:scale(1.06);
}
#backBtn:active { transform:scale(.97); }
#backBtn svg { flex-shrink:0; }
</style>
</head>
<body>
<a id="backBtn" href="javascript:history.back()" title="Regresar">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,100,120,1)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="15 18 9 12 15 6"/>
  </svg>
  Regresar
</a>

/* GALAXY — rojo vino */
(function buildGalaxy(){
  const pos=[], col=[];
  const ARMS=4, PER_ARM=5000;
  for(let arm=0;arm<ARMS;arm++){
    for(let i=0;i<PER_ARM;i++){
      const t=i/PER_ARM;
      const angle=t*Math.PI*6+(arm/ARMS)*Math.PI*2;
      const r=t*16+0.4, sp=(1-t)*1.4+0.15;
      pos.push(Math.cos(angle)*r+(Math.random()-.5)*sp,(Math.random()-.5)*sp*0.35,Math.sin(angle)*r+(Math.random()-.5)*sp);
      const br=0.55+0.45*t;
      col.push(br, 0.02+0.04*(1-t), 0.03*(1-t));
    }
  }
  for(let i=0;i<1800;i++){
    const r2=Math.pow(Math.random(),2)*3.5, a2=Math.random()*Math.PI*2;
    pos.push(Math.cos(a2)*r2,(Math.random()-.5)*.5,Math.sin(a2)*r2);
    col.push(1,0.3,0.3);
  }
  for(let i=0;i<3000;i++){
    const r3=22+Math.random()*80, a3=Math.random()*Math.PI*2, e3=(Math.random()-.5)*Math.PI;
    pos.push(Math.cos(a3)*Math.cos(e3)*r3,Math.sin(e3)*r3,Math.sin(a3)*Math.cos(e3)*r3);
    col.push(1,.85,.85);
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  geo.setAttribute('color',   new THREE.Float32BufferAttribute(col,3));
  const mat=new THREE.PointsMaterial({size:.14,vertexColors:true,transparent:true,opacity:1,
    sizeAttenuation:true,depthWrite:false,blending:THREE.AdditiveBlending});
  const pts=new THREE.Points(geo,mat);
  galaxyScene.add(pts);
  galaxyScene._pts=pts; galaxyScene._mat=mat;
  galaxyScene.add(new THREE.Mesh(new THREE.SphereGeometry(.9,16,16),
    new THREE.MeshBasicMaterial({color:0xffee00,transparent:true,opacity:.95})));
  galaxyScene.add(new THREE.Mesh(new THREE.SphereGeometry(2.0,32,32),
    new THREE.MeshBasicMaterial({color:0xffcc00,transparent:true,opacity:.55})));
  galaxyScene.add(new THREE.Mesh(new THREE.SphereGeometry(3.5,16,16),
    new THREE.MeshBasicMaterial({color:0xffaa00,transparent:true,opacity:.12,side:THREE.BackSide})));
})();

/* LOVE SCENE */
(function buildStars(){
  const pos=[];
  for(let i=0;i<4000;i++){
    const r=80+Math.random()*300,a=Math.random()*Math.PI*2,e=(Math.random()-.5)*Math.PI;
    pos.push(Math.cos(a)*Math.cos(e)*r,Math.sin(e)*r,Math.sin(a)*Math.cos(e)*r);
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  loveScene.add(new THREE.Points(geo,new THREE.PointsMaterial({
    size:.4,color:0xffaaaa,transparent:true,opacity:.85,sizeAttenuation:true,blending:THREE.AdditiveBlending})));
})();

    d.className='label3d';

  }

});

});

const heartMarkers=ORBIT_HEARTS.map((h,i)=>{
  const m=new THREE.Mesh(new THREE.SphereGeometry(.1,4,4),new THREE.MeshBasicMaterial({visible:false}));
  const x=h.r*Math.sin(h.phi)*Math.cos(h.theta);
  const y=h.r*Math.cos(h.phi);
  const z=h.r*Math.sin(h.phi)*Math.sin(h.theta);
  m.position.set(x,y,z);
  loveScene.add(m);
  return m;
});

/* SHOOTING STARS — canvas 2D realistas */
const ssCanvas=document.createElement('canvas');
ssCanvas.style.cssText='position:fixed;inset:0;z-index:7;pointer-events:none;opacity:0;transition:opacity 1s;';
ssCanvas.className='shooting-star-canvas';
document.body.appendChild(ssCanvas);
const ssCtx=ssCanvas.getContext('2d');

function resizeSS(){ ssCanvas.width=innerWidth; ssCanvas.height=innerHeight; }
resizeSS();
window.addEventListener('resize',resizeSS);

const activeStars=[];

function spawnShootingStar(){
  /* 3 tipos de profundidad: lejana (tiny), media, cercana (big) */
  const depthRoll = Math.random();
  let sizeScale, speedScale, lenScale, durScale, lineW;
  if(depthRoll < 0.45){
    sizeScale=0.28+Math.random()*0.22; speedScale=0.12+Math.random()*0.12;
    lenScale=0.3+Math.random()*0.3; durScale=1.4+Math.random()*1.0; lineW=0.6;
  } else if(depthRoll < 0.78){
    sizeScale=0.55+Math.random()*0.3; speedScale=0.28+Math.random()*0.22;
    lenScale=0.7+Math.random()*0.4; durScale=0.9+Math.random()*0.7; lineW=1.5;
  } else {
    sizeScale=0.9+Math.random()*0.5; speedScale=0.45+Math.random()*0.30;
    lenScale=1.1+Math.random()*0.7; durScale=0.55+Math.random()*0.45; lineW=2.5;
  }

  const dirRoll = Math.random();
  let sx, sy, angle;
  if(dirRoll < 0.38){
    sx = Math.random()*innerWidth; sy = -10;
    angle = (20+Math.random()*40)*(Math.PI/180);
  } else if(dirRoll < 0.58){
    sx = -10; sy = Math.random()*innerHeight*0.65;
    angle = (10+Math.random()*30)*(Math.PI/180);
  } else if(dirRoll < 0.80){
    sx = innerWidth+10; sy = Math.random()*innerHeight*0.65;
    angle = Math.PI - (15+Math.random()*35)*(Math.PI/180);
  } else {
    sx = innerWidth*0.5 + Math.random()*innerWidth*0.5; sy = -10;
    angle = Math.PI - (20+Math.random()*30)*(Math.PI/180);
  }

  const speed = innerWidth * speedScale;
  const len   = (80+Math.random()*160) * lenScale;
  const dur   = durScale;

  const palettes=[
    {head:'rgba(255,255,255,1)',  trail:'rgba(200,230,255,'},
    {head:'rgba(255,250,210,1)',  trail:'rgba(255,240,160,'},
    {head:'rgba(255,220,240,1)',  trail:'rgba(255,180,200,'},
  ];
  const pal = palettes[Math.floor(Math.random()*palettes.length)];
  const maxAlpha = depthRoll < 0.45 ? 0.45 : 1.0;

  activeStars.push({sx,sy,angle,speed,len,dur,elapsed:0,pal,done:false,spark:null,lineW,maxAlpha});
}

function updateStars(dt){
  for(let i=activeStars.length-1;i>=0;i--){
    const s=activeStars[i];
    if(s.done){ activeStars.splice(i,1); continue; }
    s.elapsed+=dt;
    const prog=s.elapsed/s.dur;
    if(prog>=1){ s.done=true; continue; }

    /* Posición de la cabeza */
    const dist=s.speed*s.elapsed;
    const hx=s.sx+Math.cos(s.angle)*dist;
    const hy=s.sy+Math.sin(s.angle)*dist;

    /* Opacidad: fade in/out con límite por profundidad */
    const mxa = s.maxAlpha !== undefined ? s.maxAlpha : 1.0;
    const lw  = s.lineW   !== undefined ? s.lineW   : 2.0;
    let alpha;
    if(prog<0.08) alpha=prog/0.08;
    else if(prog>0.82) alpha=(1-prog)/0.18;
    else alpha=1;
    alpha *= mxa;

    /* Dibujar estela — gradiente en dirección de caída */
    const tx=hx-Math.cos(s.angle)*s.len;
    const ty=hy-Math.sin(s.angle)*s.len;
    const grad=ssCtx.createLinearGradient(tx,ty,hx,hy);
    grad.addColorStop(0,'rgba(255,255,255,0)');
    grad.addColorStop(0.6,s.pal.trail+(alpha*0.85)+')');
    grad.addColorStop(1,s.pal.head.replace('1)',alpha+')'));

    ssCtx.save();
    ssCtx.globalCompositeOperation='lighter';
    ssCtx.strokeStyle=grad;
    ssCtx.lineWidth=lw+alpha*1.2;
    ssCtx.shadowColor=s.pal.trail+'0.9)';
    ssCtx.shadowBlur= mxa < 0.5 ? 3 : 8;
    ssCtx.beginPath();
    ssCtx.moveTo(tx,ty);
    ssCtx.lineTo(hx,hy);
    ssCtx.stroke();

    /* Brillo en la cabeza */
    const glowR = mxa < 0.5 ? (2+alpha*2) : (6+alpha*5);
    const rg=ssCtx.createRadialGradient(hx,hy,0,hx,hy,glowR);
    rg.addColorStop(0,s.pal.trail+(alpha)+')');
    rg.addColorStop(1,'rgba(255,255,255,0)');
    ssCtx.fillStyle=rg;
    ssCtx.beginPath();
    ssCtx.arc(hx,hy,glowR,0,Math.PI*2);
    ssCtx.fill();
    ssCtx.restore();

    /* Destello final pequeño al desaparecer — solo para estrellas cercanas/medias */
    if(prog>0.80 && !s.spark && (s.maxAlpha===undefined||s.maxAlpha>0.5)){
      s.spark={x:hx,y:hy,t:0};
    }
    if(s.spark){
      s.spark.t+=dt;
      const sp=Math.min(1,s.spark.t/0.35);
      const sr=4+sp*12;
      const sa=Math.max(0,1-sp);
      const srg=ssCtx.createRadialGradient(s.spark.x,s.spark.y,0,s.spark.x,s.spark.y,sr);
      srg.addColorStop(0,'rgba(255,255,255,'+sa+')');
      srg.addColorStop(0.4,s.pal.trail+(sa*0.7)+')');
      srg.addColorStop(1,'rgba(255,255,255,0)');
      ssCtx.save();
      ssCtx.globalCompositeOperation='lighter';
      ssCtx.fillStyle=srg;
      ssCtx.beginPath();
      ssCtx.arc(s.spark.x,s.spark.y,sr,0,Math.PI*2);
      ssCtx.fill();
      /* Rayitos del destello */
      for(let r=0;r<6;r++){
        const ra=(r/6)*Math.PI*2;
        const rl=(3+sp*10)*sa;
        ssCtx.strokeStyle='rgba(255,255,255,'+(sa*0.6)+')';
        ssCtx.lineWidth=1;
        ssCtx.beginPath();
        ssCtx.moveTo(s.spark.x,s.spark.y);
        ssCtx.lineTo(s.spark.x+Math.cos(ra)*rl,s.spark.y+Math.sin(ra)*rl);
        ssCtx.stroke();
      }
      ssCtx.restore();
    }
  }
}

let lastSS=0;
function renderStars(ts){
  if(!ssVisible){ requestAnimationFrame(renderStars); return; }
  const dt=(ts-lastSS)/1000; lastSS=ts;
  ssCtx.clearRect(0,0,ssCanvas.width,ssCanvas.height);
  updateStars(Math.min(dt,0.05));
  requestAnimationFrame(renderStars);
}
requestAnimationFrame(ts=>{ lastSS=ts; renderStars(ts); });

let ssVisible=false;

function startFloating(){
  floatingHeartsEl.classList.add('visible');
  ssCanvas.style.opacity='1';
  ssVisible=true;
  /* Ráfaga inicial */
  for(let i=0;i<8;i++) setTimeout(spawnShootingStar, i*140);
  /* Lluvia continua */
  setInterval(spawnShootingStar, 700);
}

/* WARP */
const warpLines=[];
for(let i=0;i<150;i++) warpLines.push({a:Math.random()*Math.PI*2, s:3+Math.random()*15, spd:0.4+Math.random()*0.8});

function drawWarp(intensity){
  const w=warpCanvas.width,h=warpCanvas.height,cx=w/2,cy=h/2;
  wctx.clearRect(0,0,w,h);
  warpLines.forEach(ln=>{
    const endR=ln.s+intensity*Math.max(w,h)*0.65;
    const alpha=Math.min(1,intensity*1.2)*0.7;
    const red=150+Math.floor(Math.random()*105);
    wctx.strokeStyle='rgba('+red+','+Math.floor(Math.random()*30)+','+Math.floor(Math.random()*30)+','+alpha+')';
    wctx.lineWidth=0.5+intensity*2;
    wctx.beginPath();
    wctx.moveTo(cx+Math.cos(ln.a)*ln.s, cy+Math.sin(ln.a)*ln.s);
    wctx.lineTo(cx+Math.cos(ln.a)*endR,  cy+Math.sin(ln.a)*endR);
    wctx.stroke();
    ln.a+=ln.spd*0.0015;
  });
}

/* ORBIT */
const orbit={theta:.4,phi:1.1,radius:22,targetTheta:.4,targetPhi:1.1,targetRadius:22,
  dragging:false,lastX:0,lastY:0,autoRotate:true,autoSpeed:.0018};
canvas.addEventListener('mousedown',e=>{
  if(phase!==PHASE.LOVE)return; orbit.dragging=true; orbit.autoRotate=false;
  orbit.lastX=e.clientX; orbit.lastY=e.clientY;
});
window.addEventListener('mousemove',e=>{
  if(!orbit.dragging||phase!==PHASE.LOVE)return;
  orbit.targetTheta-=(e.clientX-orbit.lastX)*0.006;
  orbit.targetPhi=Math.max(.15,Math.min(Math.PI-.15,orbit.targetPhi+(e.clientY-orbit.lastY)*0.006));
  orbit.lastX=e.clientX; orbit.lastY=e.clientY;
});
window.addEventListener('mouseup',()=>orbit.dragging=false);
canvas.addEventListener('touchstart',e=>{
  if(phase!==PHASE.LOVE)return; orbit.dragging=true; orbit.autoRotate=false;
  orbit.lastX=e.touches[0].clientX; orbit.lastY=e.touches[0].clientY;
},{passive:true});
window.addEventListener('touchmove',e=>{
  if(!orbit.dragging||phase!==PHASE.LOVE)return;
  orbit.targetTheta-=(e.touches[0].clientX-orbit.lastX)*0.006;
  orbit.targetPhi=Math.max(.15,Math.min(Math.PI-.15,orbit.targetPhi+(e.touches[0].clientY-orbit.lastY)*0.006));
  orbit.lastX=e.touches[0].clientX; orbit.lastY=e.touches[0].clientY;
},{passive:true});
window.addEventListener('touchend',()=>orbit.dragging=false);
window.addEventListener('wheel',e=>{
  if(phase!==PHASE.LOVE)return;
  orbit.targetRadius=Math.max(8,Math.min(50,orbit.targetRadius+e.deltaY*0.04));
},{passive:true});

/* PROJECT */
const _v3=new THREE.Vector3();
function project(mesh){
  _v3.setFromMatrixPosition(mesh.matrixWorld);
  _v3.project(camera);
  return{x:(_v3.x+1)/2*innerWidth, y:(-_v3.y+1)/2*innerHeight, z:_v3.z};
}

/* SCREEN SHAKE */
let shakeActive=false, shakeT=0, shakeIntensity=0;
function triggerShake(intensity, duration){
  shakeActive=true; shakeIntensity=intensity; shakeT=duration;
}
function applyShake(){
  if(!shakeActive){ document.body.style.transform=''; return; }
  const dx=(Math.random()-.5)*shakeIntensity*2;
  const dy=(Math.random()-.5)*shakeIntensity*2;
  document.body.style.transform='translate('+dx+'px,'+dy+'px)';
  shakeT-=16;
  if(shakeT<=0){ shakeActive=false; document.body.style.transform=''; }
}

/* CLICK */
let zoomProgress=0;
canvas.addEventListener('click',()=>{
  if(phase===PHASE.GALAXY){
    phase=PHASE.ZOOMING;
    hintEl.style.opacity='0';
    warpCanvas.style.opacity='1';
    triggerShake(9, 500);
  }
});

let galaxyT=0, sunT=0;

function eio(t){ return t<.5?4*t*t*t:(t-1)*(2*t-2)*(2*t-2)+1; }

function tick(){
  requestAnimationFrame(tick);
  galaxyT+=0.016; sunT+=0.016;

  if(phase===PHASE.GALAXY){
    applyShake();
    if(galaxyScene._pts) galaxyScene._pts.rotation.y+=0.003;
    camera.position.set(Math.sin(galaxyT*.4)*4, 22+Math.sin(galaxyT*.3)*2, 48+Math.sin(galaxyT*.2)*3);
    camera.lookAt(0,0,0);
    renderer.render(galaxyScene,camera); return;
  }

  if(phase===PHASE.ZOOMING){
    zoomProgress+=0.0018;
    const p=Math.min(1,zoomProgress);
    if(galaxyScene._mat) galaxyScene._mat.opacity=1-eio(p);
    const wi=p<0.6?p/0.6:(1-p)/0.4;
    drawWarp(wi*0.9);
    /* Vibración progresiva durante el zoom */
    if(p>0.05 && p<0.7){ triggerShake(Math.sin(p*Math.PI)*12, 20); }
    applyShake();
    if(p>0.45){
      const lp=(p-0.45)/0.55, ep2=eio(lp);
      const r=22+(48-22)*(1-ep2);
      camera.position.set(
        Math.sin(orbit.targetTheta)*Math.sin(orbit.targetPhi)*r,
        Math.cos(orbit.targetPhi)*r,
        Math.cos(orbit.targetTheta)*Math.sin(orbit.targetPhi)*r);
      camera.lookAt(0,0,0);
      renderer.render(loveScene,camera);
    } else {
      camera.position.set(
        Math.sin(galaxyT*.4)*4*(1-p*2.5),
        22+Math.sin(galaxyT*.3)*2*(1-p*2),
        Math.max(48-p*2*80,-30));
      camera.lookAt(0,0,0);
      renderer.render(galaxyScene,camera);
    }
    if(p>=1){
      phase=PHASE.LOVE;
      warpCanvas.style.opacity='0';
      labelsEl.classList.add('visible');
      hintEl.textContent='✦ Arrastra para orbitar · Scroll para zoom ✦';
      hintEl.style.opacity='1';
      startFloating();
    }
    return;
  }

  if(phase===PHASE.LOVE){
    sunMesh.scale.setScalar(0.95+0.05*Math.sin(sunT*2.5));
    sunGroup.rotation.y+=0.002;
    if(orbit.autoRotate) orbit.targetTheta+=orbit.autoSpeed;
    orbit.theta +=(orbit.targetTheta-orbit.theta)*0.06;
    orbit.phi   +=(orbit.targetPhi-orbit.phi)*0.06;
    orbit.radius+=(orbit.targetRadius-orbit.radius)*0.06;
    const r=orbit.radius;
    camera.position.set(
      r*Math.sin(orbit.phi)*Math.cos(orbit.theta),
      r*Math.cos(orbit.phi),
      r*Math.sin(orbit.phi)*Math.sin(orbit.theta));
    camera.lookAt(0,0,0);
    renderer.render(loveScene,camera);

    /* --- OCLUSIÓN POR PROFUNDIDAD --- */
    // Recolectamos todos los elementos con su posición 3D y distancia a la cámara
    const allItems = [];

    labelEls.forEach((el,i)=>{
      const p2=project(bubbleMeshes[i]);
      if(p2.z>1){el.style.display='none';return;}
      const dist=camera.position.distanceTo(bubbleMeshes[i].position);
      const scale=Math.max(.4,Math.min(1.2,18/dist));
      allItems.push({el, p2, dist, scale, isBubble:true, idx:i});
    });

    heartMarkers.forEach((hm,i)=>{
      const hp=project(hm);
      if(hp.z>=1){heartEls[i].style.display='none';return;}
      const dist=camera.position.distanceTo(hm.position);
      const scale=Math.max(.4,Math.min(1.2,18/dist));
      allItems.push({el:heartEls[i], p2:hp, dist, scale, isBubble:false, idx:i});
    });

    redCircleMarkers.forEach((rm,i)=>{
      const rp=project(rm);
      if(rp.z>=1){redCircleEls[i].style.display='none';return;}
      const dist=camera.position.distanceTo(rm.position);
      const scale=Math.max(.4,Math.min(1.2,18/dist));
      allItems.push({el:redCircleEls[i], p2:rp, dist, scale, isBubble:false, isCircle:true, idx:i});
    });

    // Radio del sol en proyección de pantalla (aproximado)
    const sunWorldPos=new THREE.Vector3(0,0,0);
    const sunProj=sunWorldPos.clone().project(camera);
    const sunSx=(sunProj.x+1)/2*innerWidth;
    const sunSy=(-sunProj.y+1)/2*innerHeight;
    // Distancia cámara-sol
    const sunDist=camera.position.length();
    // Radio aparente del sol en píxeles: radio 3D del sol halo exterior (~8.5) proyectado
    const sunRadiusPx = (8.5 / sunDist) * (innerHeight / (2*Math.tan(camera.fov*Math.PI/360)));

    allItems.forEach(item=>{
      const {el, p2, dist, scale} = item;

      // 1) ¿Está detrás del halo del sol? → fade de opacidad gradual
      const dx=p2.x-sunSx, dy=p2.y-sunSy;
      const dSun=Math.sqrt(dx*dx+dy*dy);
      let sunFade=1;
      if(dist > sunDist){
        const coreRadiusPx = (2.2 / sunDist) * (innerHeight / (2*Math.tan(camera.fov*Math.PI/360)));
        const haloRadiusPx = sunRadiusPx;
        if(dSun < coreRadiusPx){
          sunFade = 0.08;
        } else if(dSun < haloRadiusPx){
          const t=(dSun-coreRadiusPx)/(haloRadiusPx-coreRadiusPx);
          sunFade = 0.08 + 0.92*t;
        }
      }

      // Visible
      if(item.isBubble){
        el.style.display='flex';
        el.style.opacity=p2.z<.99?String(sunFade):'0';
      } else {
        el.style.display='block';
        el.style.opacity=String(sunFade);
      }
      el.style.left=p2.x+'px';
      el.style.top=p2.y+'px';
      el.style.transform='translate(-50%,-50%) scale('+scale+')';
      el.style.zIndex=String(Math.round(10000-dist*10));
    });
  }
}
tick();
</script>
